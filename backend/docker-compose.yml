version: "3.8"

services:
  # ── FastAPI Backend ──────────────────────────
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app          # hot reload in dev
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      - redis
    networks:
      - cms-network

  # ── Redis (Celery broker / caching) ──────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cms-network

  # ── Celery Worker (background tasks) ─────────
  celery-worker:
    build: .
    env_file:
      - .env
    command: celery -A app.worker worker --loglevel=info
    depends_on:
      - redis
    networks:
      - cms-network

  # NOTE: Supabase runs separately via `supabase start` (CLI)
  # Local Supabase: http://localhost:54321 (API) / http://localhost:54323 (Studio)

networks:
  cms-network:
    driver: bridge
