version: "3.8"

services:
  # ── FastAPI Backend ──────────────────────────
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app          # hot reload in dev
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  # ── Redis (Celery broker / caching) ──────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cms-network

  # ── Celery Worker (background tasks) ─────────
  celery-worker:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q default,notifications,invoices,geo,periodic
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  # ── Celery Beat (periodic task scheduler) ────
  celery-beat:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  # ── Flower (Celery monitoring dashboard) ─────
  flower:
    build: .
    env_file:
      - .env
    ports:
      - "5555:5555"
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  # NOTE: Supabase runs separately via `supabase start` (CLI)
  # Local Supabase: http://localhost:54321 (API) / http://localhost:54323 (Studio)

networks:
  cms-network:
    driver: bridge

volumes:
  redis-data:
